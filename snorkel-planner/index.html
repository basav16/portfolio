<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DaaS Capacity Planner</title>
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#0d2b3a;--mut:#566a73;--line:#c3cfd4;--accent:#0b7a85;--accentInk:#fff;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1519;--card:#132027;--ink:#e4eef1;--mut:#93a7ae;--line:#2f454e;--accent:#3fb5bf;--accentInk:#06181b;--bad:#f07a70;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.eyb{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h1{font-size:20px;margin:4px 0 4px}
p{margin:0 0 16px;color:var(--mut);font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--accentInk);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:20px;margin:10px 0 0;font-size:13px}
#msg.bad{color:var(--bad)}
</style>
</head>

</form>

const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)));
}
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{
  e.preventDefault();go.disabled=true;msg.className='';msg.textContent='Opening...';
  let html;
  try{html=await unlock(pw.value)}catch(err){go.disabled=false;msg.className='bad';msg.textContent="That password didn't work. Try again.";pw.select();return}
  document.open();document.write(html);document.close();
});
</script>
